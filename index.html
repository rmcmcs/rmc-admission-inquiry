<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome to RMC College Akurdi - Admission Inquiry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0d47a1,#42a5f5);
min-height:100vh;
padding:20px;
} 
    .container{
max-width:850px;
margin:auto;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.banner-image img{
width:100%;
display:block;
}

.form-container{
padding:30px;
}

.heading{
text-align:center;
margin-bottom:25px;
}

.heading h1{
color:#0d47a1;
font-size:28px;
margin-bottom:10px;
}

.heading p{
color:#555;
font-size:16px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:600;
color:#333;
}

input,
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
}

input:focus,
select:focus{
outline:none;
border-color:#1976d2;
box-shadow:0 0 5px rgba(25,118,210,.3);
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#1565c0;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0d47a1;
}

.success{
display:none;
margin-top:15px;
padding:12px;
background:#d4edda;
color:#155724;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.footer{
text-align:center;
padding:10px;
color:#555;
font-size:14px;
border-top:1px solid #eee;
}

@media(max-width:768px){

.form-container{
padding:20px;
}

.heading h1{
font-size:22px;
}

.heading p{
font-size:14px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="banner-image">
<img src="college-banner.jpg" alt="RMC College Banner">
</div>

<div class="form-container">

<div class="heading">
<h1>M.Sc. Computer Science Admission Inquiry</h1>
<p>Please fill the form below. Our admission team will contact you.</p>
</div>

<form id="form">

<label>Name *</label>
<input type="text"
name="name"
pattern="[A-Za-z ]{3,50}"
title="Enter only letters"
required>

<label>Email ID *</label>
<input type="email"
name="email"
required>

<label>Mobile Number *</label>
<input type="tel"
name="mobile"
pattern="[0-9]{10}"
maxlength="10"
title="Enter 10 digit mobile number"
required>

<label>Caste *</label>
<select name="caste" required>
<option value="">Select Caste</option>
<option>OPEN</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>NT</option>
<option>SBC</option>
<option>EWS</option>
</select>

<label> Degree *</label>
<select name="degree" required>

<option value="">Select Degree </option>

<option>BCS </option>

<option>B.Sc Computer Science </option>

<option>B.E Computer Engineering </option>

<option>B.E Information Technology </option>

<option>B.E Electronics & Telecommunication </option>

<option>B.Tech Computer Engineering </option>

<option>B.Tech Information Technology </option>

<option>B.Tech Electronics & Telecommunication </option>

<option>B.Sc Information Technology </option>

<option>B.Voc Software Development </option>

<option>B.Voc Information Technology </option>

<option>B.Sc with Computer Science at T.Y.B.Sc Level </option>

<option>B.Sc Data Science</option>

<option>B.Sc Artificial Intelligence</option>

<option>Other </option>

</select>

<label>Degree College Name *</label>
<input type="text"
name="college"
required>

<label>Passout Year *</label>
<input type="number"
name="passout"
min="2000"
max="2035"
required>

<label>University *</label>
<input type="text"
name="university"
required>

<label>Percentage *</label>
<input type="number"
name="percentage"
min="0"
max="100"
step="0.01"
required>

<button type="submit">
Submit Inquiry
</button>

</form>

<div id="msg" class="success">
Thanks for Contacting Us.<br>
Our Admission Team Will Contact You Shortly.
</div>

</div>

<div class="footer">
     <footer style="margin-top:30px; padding:15px; text-align:center; background:#333; color:white;">
     Developed By: Prof. Rekha K. Kakade   &nbsp; | &nbsp;   Prof. Sudarshan G. Lakhdive
     </footer>
</div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbwxTpNmP-GYD985jTOSU26ynxJ4DwUbuY1dgLYxqbcGwsCfw29zb4qprXAhFzJdU4XRXQ/exec";

document.getElementById("form").addEventListener("submit", function(e){

e.preventDefault();

const mobile=this.mobile.value;
const percentage=parseFloat(this.percentage.value);
const passout=parseInt(this.passout.value);

if(!/^[0-9]{10}$/.test(mobile)){
alert("Please enter a valid 10-digit mobile number.");
return;
}

if(percentage<0 || percentage>100){
alert("Percentage must be between 0 and 100.");
return;
}

if(passout<2000 || passout>2035){
alert("Please enter a valid Passout Year.");
return;
}

fetch(scriptURL,{
method:"POST",
body:new URLSearchParams(
new FormData(this)
)
})
.then(response=>response.text())
.then(data=>{

document.getElementById("msg").style.display="block";

this.reset();

window.scrollTo({
top:0,
behavior:"smooth"
});

setTimeout(()=>{
document.getElementById("msg").style.display="none";
},4000);

})
.catch(error=>{
alert("Submission Failed. Please try again.");
});

});

</script>

</body>
</html>

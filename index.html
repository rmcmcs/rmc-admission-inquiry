<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMC College Akurdi - Admission Inquiry</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
}

.header {
    background: #003366;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    width: 90%;
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
}

button {
    width: 100%;
    padding: 12px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: darkgreen;
}

.success {
    display: none;
    color: green;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
    <h1>RMC College Akurdi</h1>
    <p>Admission Inquiry Form</p>
</div>

<div class="container">

<form id="admissionForm">

    <input type="text" id="name" placeholder="Full Name" required>

    <input type="email" id="email" placeholder="Email ID" required>

    <input type="tel" id="mobile" placeholder="Mobile Number" pattern="[0-9]{10}" required>

    <select id="caste" required>
        <option value="">Select Caste</option>
        <option>General</option>
        <option>OBC</option>
        <option>SC</option>
        <option>ST</option>
    </select>

    <select id="degree" required>
        <option value="">Select Degree</option>
        <option>BSc Computer Science</option>
        <option>BCA</option>
        <option>BSc IT</option>
        <option>BCom</option>
        <option>BBA</option>
    </select>

    <input type="text" id="college" placeholder="Degree College Name" required>

    <input type="number" id="year" placeholder="Passout Year" required>

    <input type="text" id="university" placeholder="University Name" required>

    <input type="number" id="percentage" placeholder="Percentage" required>

    <button type="submit">Submit Inquiry</button>

</form>

<div class="success" id="successMsg">
    ✅ Thank you for contacting RMC College Akurdi!
</div>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwxTpNmP-GYD985jTOSU26ynxJ4DwUbuY1dgLYxqbcGwsCfw29zb4qprXAhFzJdU4XRXQ/exec";

document.getElementById("admissionForm").addEventListener("submit", function(event){
    event.preventDefault(); // 🔥 stop page reload

    let data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        mobile: document.getElementById("mobile").value,
        caste: document.getElementById("caste").value,
        degree: document.getElementById("degree").value,
        college: document.getElementById("college").value,
        year: document.getElementById("year").value,
        university: document.getElementById("university").value,
        percentage: document.getElementById("percentage").value
    };

    fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(data)
    })
    .then(response => response.text())
    .then(result => {

        document.getElementById("successMsg").style.display = "block";

        document.getElementById("successMsg").scrollIntoView({
            behavior: "smooth",
            block: "end"
        });

        document.getElementById("admissionForm").reset();

    })
    .catch(error => {
        alert("Error submitting form!");
    });
});
</script>

</body>
</html>
</body>
</html>
